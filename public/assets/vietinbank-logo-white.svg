<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="100%" height="100%">
  <!-- VietinBank Coin Emblem (Right side) -->
  <g transform="translate(360, 10)">
    <!-- Upper Blue/White Arch -->
    <path fill="#7ED3F7" d="M 0,44 A 44,44 0 0,1 88,44 L 88,40 A 44,44 0 0,0 0,40 Z M 22,42 L 22,26 A 22,22 0 0,1 66,26 L 66,42 L 52,42 L 52,32 A 8,8 0 0,0 36,32 L 36,42 Z" />
    <!-- Lower Red Crescent -->
    <path fill="#D71249" d="M 4,49 A 44,44 0 0,0 84,49 L 70,49 A 30,30 0 0,1 18,49 Z" />
  </g>

  <!-- Wordmark: VietinBank in White with red accent -->
  <text x="10" y="65" font-family="'SVN-Gilroy', 'Be Vietnam Pro', system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5" fill="#FFFFFF">
    Viet<tspan fill="#D71249">i</tspan>nBank
  </text>

  <!-- Branch Subtitle: Chi Nhánh Kiên Giang in light blue -->
  <text x="12" y="112" font-family="'SVN-Gilroy', 'Be Vietnam Pro', system-ui, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.3" fill="#7ED3F7">
    Chi Nhánh Kiên Giang
  </text>
</svg>
