<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <linearGradient id="vtbBloom" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#005993" />
      <stop offset="35%" stop-color="#0088cc" />
      <stop offset="60%" stop-color="#7ED3F7" />
      <stop offset="78%" stop-color="#e8386a" />
      <stop offset="100%" stop-color="#D71249" />
    </linearGradient>
    <linearGradient id="vtbGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D71249" />
      <stop offset="25%" stop-color="#ff6b8b" />
      <stop offset="50%" stop-color="#7ED3F7" />
      <stop offset="100%" stop-color="#005993" />
    </linearGradient>
  </defs>
  <!-- Base background band -->
  <rect x="0" y="0" width="1200" height="40" fill="url(#vtbBloom)" />
  <!-- Overlapping stylized blooming petals / geometric ribbons -->
  <path d="M 0,40 Q 300,10 600,25 T 1200,5 L 1200,40 Z" fill="#D71249" opacity="0.45" />
  <path d="M 0,40 Q 400,30 800,15 T 1200,20 L 1200,40 Z" fill="#7ED3F7" opacity="0.35" />
  <path d="M 150,0 Q 450,40 750,10 T 1150,40 L 1200,40 L 1200,0 Z" fill="#005993" opacity="0.25" />
  <!-- Accent light rim -->
  <line x1="0" y1="2" x2="1200" y2="2" stroke="#7ED3F7" stroke-width="2" opacity="0.6" />
</svg>
